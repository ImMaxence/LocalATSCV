name: Signaler un problème
description: Quelque chose ne fonctionne pas comme prévu.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème !
        ⚠️ **Ne collez jamais le contenu de votre CV ni de données personnelles ici** : les tickets sont publics.
  - type: textarea
    id: description
    attributes:
      label: Que s'est-il passé ?
      description: Décrivez le problème et ce que vous attendiez à la place.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
        3. Constater…
  - type: input
    id: version
    attributes:
      label: Version de LocalATSCV
      description: Pré-remplie automatiquement depuis l'application.
  - type: input
    id: page
    attributes:
      label: Page concernée
  - type: input
    id: language
    attributes:
      label: Langue de l'interface
  - type: input
    id: browser
    attributes:
      label: Navigateur
