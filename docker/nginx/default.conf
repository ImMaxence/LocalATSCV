server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Confidentialité : aucun journal d'accès, les adresses IP des visiteurs ne sont pas conservées.
    access_log off;
    server_tokens off;

    # Types absents du mime.types de nginx : manifeste PWA, Markdown (changelog) et
    # modules .mjs (worker pdf.js, refusé par les navigateurs sans type JavaScript).
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        text/markdown md;
        text/javascript mjs;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers générés par Angular avec une empreinte dans le nom : cache permanent.
    location ~ "-[A-Z0-9]{8}\.(?:js|css|woff2)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Autres fichiers (index.html, ngsw.json, traductions, icônes…) : revalidation à chaque fois.
    # Indispensable pour que le service worker détecte les nouvelles versions.
    location ~* "\.[a-z0-9]+$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Pages publiques pré-générées au build (accueil, analyseur, nouveautés, pages légales) :
    # /analyze sert analyze/index.html. Les autres routes (éditeur) reçoivent la page de secours
    # index.csr.html, rendue dans le navigateur.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html /index.csr.html;
    }
}
