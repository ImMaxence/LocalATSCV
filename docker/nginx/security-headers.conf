# En-têtes de sécurité, inclus dans chaque bloc `location` :
# nginx n'hérite pas des add_header du niveau server dès qu'un location en déclare.

# CSP : l'application ne peut contacter aucun autre domaine (connect-src 'self').
# C'est la garantie technique de la promesse « aucune donnée envoyée ».
# 'unsafe-inline' pour les styles est requis par Angular (styles de composants injectés).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
